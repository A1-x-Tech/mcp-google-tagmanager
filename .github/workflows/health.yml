name: Health check

# End-to-end read-only check against the live Google Tag Manager API v2
# (tagmanager.googleapis.com). Auth is an OAuth client-id/secret/refresh-token
# trio stored as repo secrets — the smoke exchanges the refresh token itself and
# makes NO writes (lists the visible GTM accounts). Runs daily + manual dispatch
# only (never on push/PR), so secrets aren't exposed to PRs/forks. The smoke
# step is skipped entirely while the secrets are not configured.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: github.repository == 'A1-x-Tech/mcp-google-tagmanager'
    env:
      GOOGLE_TAGMANAGER_CLIENT_ID: ${{ secrets.GOOGLE_TAGMANAGER_CLIENT_ID }}
      GOOGLE_TAGMANAGER_CLIENT_SECRET: ${{ secrets.GOOGLE_TAGMANAGER_CLIENT_SECRET }}
      GOOGLE_TAGMANAGER_REFRESH_TOKEN: ${{ secrets.GOOGLE_TAGMANAGER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - name: Read-only smoke check
        if: env.GOOGLE_TAGMANAGER_REFRESH_TOKEN != ''
        run: npm run smoke
